name: 编译安卓 APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '打包类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-11-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV

      - name: 缓存 buildozer 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-v1
          restore-keys: buildozer-${{ runner.os }}-

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: 编译 APK
        run: |
          yes | buildozer -v android ${{ github.event.inputs.build_type }}

      - name: 收集产物
        run: |
          mkdir -p apk_out
          find bin -name "*.apk" -exec cp {} apk_out/ \;
          ls -lh apk_out/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: aiwriter-apk-${{ github.event.inputs.build_type }}
          path: apk_out/*.apk
          retention-days: 30
          if-no-files-found: error
